name: Build RainbowKeyboard

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install dpkg ldid xz
      - name: Install Roothide Theos
        run: |
          set -e
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          rm -rf "$HOME/theos"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Verify source configuration
        run: |
          set -e
          grep -q '^ARCHS := arm64$' Makefile
          grep -q '^Architecture: iphoneos-arm64$' control
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
      - name: Build Rootless
        run: |
          set -e
          make clean || true
          rm -rf packages build
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          mkdir -p build
          cp "$f" build/RainbowKeyboard-rootless.deb
      - name: Build Roothide
        run: |
          set -e
          make clean || true
          rm -rf packages
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          cp "$f" build/RainbowKeyboard-roothide.deb
      - name: Verify packages
        run: |
          set -e
          for deb in build/*.deb; do
            echo "===== $deb ====="
            dpkg-deb -f "$deb" Architecture
            dpkg-deb -c "$deb" | grep -q 'Library/PreferenceLoader/Preferences/RainbowKeyboardPrefs.plist'
            dpkg-deb -c "$deb" | grep -q 'Library/PreferenceBundles/RainbowKeyboardPrefs.bundle'
          done
      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-debs
          path: build/*.deb
          if-no-files-found: error
