name: Build RainbowKeyboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_URL: https://github.com/theos/sdks/releases/download/15.2-2/iPhoneOS15.2.sdk.tar.xz

jobs:
  rootless:
    name: Build Rootless deb
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/iPhoneOS15.2.sdk.tar.xz" "$SDK_URL"
          tar -xJf "$RUNNER_TEMP/iPhoneOS15.2.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build Rootless package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Upload Rootless deb
        uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-rootless
          path: packages/*.deb
          if-no-files-found: error

  roothide:
    name: Build Roothide deb
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Roothide Theos
        run: |
          git clone --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          set -e
          mkdir -p "$HOME/theos/sdks"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o "$RUNNER_TEMP/iPhoneOS15.2.sdk.tar.xz" "$SDK_URL"
          tar -xJf "$RUNNER_TEMP/iPhoneOS15.2.sdk.tar.xz" -C "$HOME/theos/sdks"
      - name: Build Roothide package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Upload Roothide deb
        uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-roothide
          path: packages/*.deb
          if-no-files-found: error
