name: Build KBGlow iOS17 RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz

      - name: Set THEOS
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "THEOS_MAKE_PATH=$HOME/theos/makefiles" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install RootHide Theos
        run: |
          set -e
          rm -rf "$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"

      - name: Install iPhoneOS 16.5 SDK
        run: |
          set -e
          rm -rf /tmp/theos-sdks
          mkdir -p "$HOME/theos/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R "iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

      - name: Verify Theos environment
        run: |
          set -e
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/tweak.mk"

      - name: Verify KBGlow source
        run: |
          set -e
          test -f Makefile
          test -f Tweak.xm
          test -f control
          test -f KBGlow.plist
          test -f KBGlowPrefs/Makefile
          test -f KBGlowPrefs/Info.plist
          test -f KBGlowPrefs/RootListController.m
          test -f KBGlowPrefs/ColorPickerController.m
          grep -E '^(Package|Name|Version|Depends):' control

      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Build RootHide
        run: |
          set -e
          make clean
          THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1

      - name: Copy RootHide package
        run: |
          set -e
          ROOTHIDE_DEB=$(find packages -maxdepth 1 -type f -name "*.deb" | head -n 1)
          test -n "$ROOTHIDE_DEB"
          cp "$ROOTHIDE_DEB" "build/KBGlow-iOS17-roothide.deb"

      - name: Verify DEB package
        run: |
          set -e
          DEB="build/KBGlow-iOS17-roothide.deb"
          test -f "$DEB"
          echo "===== Package info ====="
          dpkg-deb -I "$DEB"
          echo ""
          echo "===== Installed files ====="
          dpkg-deb -c "$DEB"
          echo ""
          echo "===== Check PreferenceBundle ====="
          if dpkg-deb -c "$DEB" | grep -q "KBGlowPrefs.bundle"; then
            echo "✓ KBGlowPrefs.bundle found in deb"
            mkdir -p /tmp/deb_check
            dpkg-deb -x "$DEB" /tmp/deb_check
            BUNDLE_PATH=$(find /tmp/deb_check -name "KBGlowPrefs.bundle" -type d | head -1)
            echo "Bundle path: $BUNDLE_PATH"
            echo "Bundle contents:"
            ls -laR "$BUNDLE_PATH"
            BUNDLE_SIZE=$(du -sk "$BUNDLE_PATH" | cut -f1)
            echo "Bundle size: ${BUNDLE_SIZE} KB"
            if [ "$BUNDLE_SIZE" -gt 0 ]; then
              echo "✓ Bundle is NOT empty"
            else
              echo "✗ Bundle is EMPTY!"
              exit 1
            fi
          else
            echo "✗ KBGlowPrefs.bundle NOT found in deb!"
            exit 1
          fi

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: KBGlow-iOS17-RootHide
          path: build/KBGlow-iOS17-roothide.deb
