name: Build RainbowKeyboard Native Packages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  rootless:
    name: Native Rootless deb
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz
      - name: Install Theos and SDK
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build native Rootless
        run: |
          set -e
          rm -rf packages build
          ARCHS=arm64 THEOS_PACKAGE_SCHEME=rootless make clean package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          mkdir -p build
          cp "$f" build/RainbowKeyboard-rootless.deb
      - name: Validate native Rootless package
        run: |
          set -e
          d=build/RainbowKeyboard-rootless.deb
          test "$(dpkg-deb -f "$d" Architecture)" = iphoneos-arm64
          ! dpkg-deb -c "$d" | grep -q 'pkgmirror'
          dpkg-deb -c "$d" | grep -q 'RainbowKeyboard.dylib'
          files=$(dpkg-deb -c "$d")
          printf '%s\n' "$files" | grep -q 'Library/PreferenceBundles/RainbowKeyboardPrefs.bundle/Info.plist'
          printf '%s\n' "$files" | grep -q 'Library/PreferenceBundles/RainbowKeyboardPrefs.bundle/Resources/RainbowKeyboard.plist'
          printf '%s\n' "$files" | grep -q 'Library/PreferenceLoader/Preferences/com.minis.rainbowkeyboard.prefs.plist'
          dpkg-deb -f "$d" Depends | grep -qi 'preferenceloader'
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-native-rootless
          path: build/RainbowKeyboard-rootless.deb

  roothide:
    name: Native Roothide deb
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install dpkg ldid xz
      - name: Install Roothide Theos and SDK
        run: |
          set -e
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
      - name: Build native Roothide
        run: |
          set -e
          rm -rf packages build
          rm -rf .theos packages build
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          ARCHS=arm64e THEOS_PACKAGE_ARCH=iphoneos-arm64e THEOS_PACKAGE_SCHEME=roothide make package FINALPACKAGE=1
          f=$(find packages -maxdepth 1 -type f -name '*.deb' | head -n 1)
          test -n "$f"
          mkdir -p build
          cp "$f" build/RainbowKeyboard-roothide.deb
      - name: Inspect native Roothide package
        run: |
          set -e
          d=build/RainbowKeyboard-roothide.deb
          test -s "$d"
          echo "Package architecture:"
          dpkg-deb -f "$d" Architecture
          echo "Package files:"
          dpkg-deb -c "$d"
          files=$(dpkg-deb -c "$d")
          if printf '%s\n' "$files" | grep -q 'pkgmirror'; then
            echo 'ERROR: converted package contains pkgmirror'
            exit 1
          fi
          printf '%s\n' "$files" | grep -q 'Library/PreferenceBundles/RainbowKeyboardPrefs.bundle/Info.plist'
          printf '%s\n' "$files" | grep -q 'Library/PreferenceBundles/RainbowKeyboardPrefs.bundle/Resources/RainbowKeyboard.plist'
          printf '%s\n' "$files" | grep -q 'Library/PreferenceLoader/Preferences/com.minis.rainbowkeyboard.prefs.plist'
          dpkg-deb -f "$d" Depends | grep -qi 'preferenceloader'
      - uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-native-roothide
          path: build/RainbowKeyboard-roothide.deb
