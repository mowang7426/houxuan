name: Build RainbowKeyboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless:
    name: Build Rootless deb
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Theos
        uses: theos/setup-theos@v0.1.0
        with:
          theos-src: theos/theos
      - name: Install iOS SDK
        run: |
          curl -L --fail --retry 3 -o sdk.zip \
            https://github.com/theos/sdks/releases/download/15.2-2/iPhoneOS15.2.sdk.tar.xz
          mkdir -p "$THEOS/sdks"
          tar -xJf sdk.zip -C "$THEOS/sdks"
      - name: Build Rootless package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Upload Rootless deb
        uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-rootless
          path: packages/*.deb
          if-no-files-found: error

  roothide:
    name: Build Roothide deb
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Roothide Theos
        run: |
          git clone --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Install iOS SDK
        run: |
          curl -L --fail --retry 3 -o sdk.tar.xz \
            https://github.com/theos/sdks/releases/download/15.2-2/iPhoneOS15.2.sdk.tar.xz
          mkdir -p "$HOME/theos/sdks"
          tar -xJf sdk.tar.xz -C "$HOME/theos/sdks"
      - name: Build Roothide package
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
      - name: Upload Roothide deb
        uses: actions/upload-artifact@v4
        with:
          name: RainbowKeyboard-roothide
          path: packages/*.deb
          if-no-files-found: error
